version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: greenhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greenhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenhouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: greenhouse-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenhouse-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/greenhouse?sslmode=disable
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID: greenhouse-backend-docker
      MQTT_COMMAND_TOPIC_PREFIX: greenhouse/control
      COMMAND_CHANNEL_BUFFER_SIZE: 100

volumes:
  postgres_data:
  mosquitto_data: